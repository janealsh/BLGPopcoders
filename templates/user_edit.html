<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Edit User</title>
    <style>body{font-family:Arial;margin:20px}label{display:block;margin-top:8px}</style>
</head>
<body>
    <h1>Edit User {{ row.user_id }}</h1>
    <form method="POST" action="{{ url_for('update_user') }}">
        <input type="hidden" name="user_id" value="{{ row.user_id }}">
        <label>First name</label>
        <input type="text" name="first_name" value="{{ row.first_name or '' }}">
        <label>Email</label>
        <input type="email" name="email" value="{{ row.email or '' }}">
        <label>Active</label>
        <input type="checkbox" name="is_active" value="1" {% if row.is_active %}checked{% endif %}>
        <div style="margin-top:12px">
            <button type="submit">Save</button>
            <a href="{{ url_for('users_list') }}" style="margin-left:12px">Cancel</a>
        </div>
    </form>
</body>
</html>
