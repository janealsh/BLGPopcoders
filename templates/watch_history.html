<!DOCTYPE html>
<html>
  <head>
  <head>
    <title>Watch History</title>
    <style>
    :root{
            --bg:#f6f8fb;
            --card:#ffffff;
            --muted:#666b75;
            --accent:#2563eb;
            --danger:#dc2626;
            --radius:10px;
            --max-width:1100px;
        }
    html,body{height:100%;}
    body{
            margin:0;
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background:var(--bg);
            color:#17202a;
            -webkit-font-smoothing:antialiased;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content: flex-start;
            padding:32px 20px;
      }
      table {
        /* border-collapse: collapse; */
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        table-layout: auto;
      }
      th,td {
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #efe2e2;
        position: sticky;
        top: 0;
      }
      tr:nth-child(even) {
        background-color: #f9f9f9;
      }
      tr:hover {
        background-color: #f5f5f5;
      }
      .delete-button {
        background-color: #b02615;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 4px;
      }
      .delete-button:hover {
        background-color: #a02515;
      }
    </style>
  </head>
  <body>
    <h1>Your Watch History</h1>
    <p>Below is your watch history. You can click on a movie title to view more details.</p>

    <a href="/">Back to Home</a>
</body>
</html>
