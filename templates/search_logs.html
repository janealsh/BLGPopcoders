<!doctype html>
<html>
<head>
    <title>Search Logs Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid #333;
            padding: 8px;
        }
        th {
            background-color: #ddd;
        }
        form {
            margin-bottom: 20px;
        }
        input, button {
            margin: 5px 0;
        }
        button {
            cursor: pointer;
        }
        .delete-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 4px 10px;
        }
    </style>
</head>
<body>

    <h1>🔍 Search Logs Manager</h1>

    <!-- Add Search Form -->
    <h3>Add New Search Log</h3>
    <form action="{{ url_for('add_search_log') }}" method="POST">
        <label>User ID:</label><br>
        <input type="number" name="user_id" required><br>

        <label>Search Query:</label><br>
        <input type="text" name="search_query" required><br>

        <label>Location Country:</label><br>
        <input type="text" name="location_country" value="USA"><br>

        <label>Clicked Result Position (optional):</label><br>
        <input type="number" name="clicked_result_position"><br>

        <button type="submit">Add Log</button>
    </form>

    <!-- Logs Table -->
    <h3>Recent Search Logs</h3>
    <table>
        <tr>
            <!--<th>ID</th>-->
            <th>User ID</th>
            <th>Query</th>
            <th>Date</th>
            <th>Country</th>
            <th>Actions</th>
        </tr>

        {% for row in logs %}
        <tr>
            <!-- <td>{{ row.search_id }}</td>-->
            <td>{{ row.user_id }}</td>
            <td>{{ row.search_query }}</td>
            <td>{{ row.search_date }}</td>
            <td>{{ row.location_country }}</td>
            <td>
                <form method="POST" action="{{ url_for('delete_search_log', search_id=row.search_id) }}">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
