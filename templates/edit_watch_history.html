<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Edit Watch History</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f6f8fb;
        padding: 20px;
      }
      form {
        max-width: 800px;
        background: #fff;
        padding: 16px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row > div {
        flex: 1;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }
      .btn {
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
      }
      .save {
        background: #2563eb;
        color: #fff;
      }
      .cancel {
        background: #888;
        color: #fff;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <h2>Edit Watch History</h2>
    {% set e = entry %}
    <form method="post" action="/update_watch_history">
      <input type="hidden" name="session_id" value="{{ e[0] }}" />

      <label>User ID</label>
      <input type="text" name="user_id" value="{{ e[1] }}" />

      <label>Movie ID</label>
      <input type="text" name="movie_id" value="{{ e[2] }}" />

      <div class="row">
        <div>
          <label>Watch date</label>
          <input type="date" name="watch_date" value="{{ e[3] }}" />
        </div>
        <div>
          <label>Mins watched</label>
          <input
            type="number"
            step="0.01"
            name="watch_duration_minutes"
            value="{{ e[4] }}"
          />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Progress %</label>

          <div style="display: flex; align-items: center; gap: 8px">
            <input
              id="progress_range"
              type="range"
              name="progress_percentage"
              min="0"
              max="100"
              step="0.01"
              value="{{ e[5] or 0 }}"
            />
            <span id="progress_value">{{ e[5] or 0 }}</span>%
          </div>
        </div>
        <div>
          <label>Rating</label>
          <input type="number" step="1" name="user_rating" value="{{ e[7] }}" />
        </div>
      </div>

      <label>Country</label>
      <input type="text" name="location_country" value="{{ e[6] }}" />

      <div class="actions">
        <button type="submit" class="btn save">Save</button>
        <a href="/watch_history" class="btn cancel">Cancel</a>
      </div>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          const range = document.getElementById("progress_range");
          const display = document.getElementById("progress_value");
          if (range && display) {
            // keep display in sync while sliding
            range.addEventListener("input", () => {
              display.textContent = range.value;
            });
          }
        });
      </script>
    </form>
  </body>
</html>
